<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="description" content="Personal vault dashboard">
  <title>Kernel</title>
  <script>
    /* set theme before first paint to avoid flash */
    (function () {
      var pref = localStorage.getItem("kernel_theme") || "auto";
      var t = pref !== "auto" ? pref
        : (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css?v=22">
</head>
<body>
  <header id="topbar">
    <div class="brand">⌘ Kernel</div>
    <div id="sync-status" class="sync-status"></div>
    <button id="btn-theme" class="icon-btn" title="Toggle theme" aria-label="Toggle theme"></button>
    <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings"></button>
  </header>

  <main id="view" class="view"></main>

  <button id="fab" class="hidden" aria-label="Add tasks"></button>

  <div id="composer" class="sheet-backdrop center hidden">
    <div class="sheet">
      <h3>Add tasks</h3>
      <p class="muted">One task per line — all saved in a single sync.</p>
      <textarea id="composer-text" rows="5" placeholder="Buy credits&#10;Call Hamza about renewal&#10;…"></textarea>
      <div class="sheet-actions">
        <button class="btn secondary" id="composer-cancel">Cancel</button>
        <button class="btn" id="composer-add">Add</button>
      </div>
    </div>
  </div>

  <div id="habit-modal" class="sheet-backdrop center hidden">
    <div class="sheet">
      <h3>Add habit</h3>
      <p class="muted">It shows up in the list right away and starts tracking from today.</p>
      <input type="text" id="habit-name" placeholder="e.g. Drink 2L water" maxlength="60">
      <div class="sheet-actions">
        <button class="btn secondary" id="habit-cancel">Cancel</button>
        <button class="btn" id="habit-add">Add</button>
      </div>
    </div>
  </div>

  <div id="client-sheet" class="sheet-backdrop hidden"></div>

  <nav id="tabbar">
    <button data-view="today" data-icon="sun" class="tab active"><span class="ticon"></span>Today</button>
    <button data-view="habits" data-icon="checkCircle" class="tab"><span class="ticon"></span>Habits</button>
    <button data-view="money" data-icon="card" class="tab"><span class="ticon"></span>Finances</button>
    <button data-view="articles" data-icon="book" class="tab"><span class="ticon"></span>Read</button>
    <button data-view="clients" data-icon="users" class="tab"><span class="ticon"></span>Clients</button>
  </nav>

  <script src="app.js?v=22"></script>
</body>
</html>
